<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Online Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div class="container my-4">
	    <div class="row">
	        <div class="col-md-8 mx-auto rounded border p-4">
	            <h2 class="header">Edit</h2>
	            <form method="post" th:action="@{/edit/{id}(id=${productDTO.id})}" th:object="${productDTO}">
					<input type="hidden" th:field="*{id}">
	                <div class="row mb-3" style="display:flex; gap:15px;">
						<div class="row">
							<label class="col-sm-4 col-form-label">Name</label> 
							<div class="col-sm-8">
							    <input class="form-control" th:field="*{name}"> 
							    <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}"></p>
							</div>
						</div>
	
						<div class="row">
						    <label class="col-sm-4 col-form-label">Price</label> 
						    <div class="col-sm-8">
						        <input class="form-control" th:field="*{price}">
						        <p th:if="${#fields.hasErrors('price')}" th:errorclass="text-danger" th:errors="*{price}"></p>
						    </div>
						</div>
	
						<div class="row">
						    <label class="col-sm-4 col-form-label">Type</label> 
						    <div class="col-sm-8">
						        <select class="form-control" th:field="*{type}"> 
						            <option value="furniture">Furniture</option>
						            <option value="electronic">Electronic</option>
						            <option value="home_kitchen">Home/Kitchen</option>
						            <option value="fashion">Fashion</option>
						        </select>
						        <p th:if="${#fields.hasErrors('type')}" th:errorclass="text-danger" th:errors="*{type}"></p>
						    </div>
						</div>
	
						<div class="row">
						    <label class="col-sm-4 col-form-label">Description</label> 
						    <div class="col-sm-8">
						        <input class="form-control" th:field="*{description}">
						        <p th:if="${#fields.hasErrors('description')}" th:errorclass="text-danger" th:errors="*{description}"></p>
						    </div>
						</div>
	
						<div class="row">
						    <div class="offset-sm-4 col-sm-4 d-grid">
						        <button type="submit" class="btn btn-primary">Submit</button>
						    </div>
						    
						    <div class="col-sm-4 d-grid">
						        <a type="submit" class="btn btn-outline-primary" href="/">Cancel</a>
						    </div>
						</div>
					</div>
	            </form>
	        </div>
	    </div>
	</div>
</body>
</html>

<style>
    .header {    
        font-weight:bold;
        font-family:"Calibri";
    }
</style>
